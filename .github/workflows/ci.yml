name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'refactor/*'
  pull_request:
    branches:
      - main
      - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Backend: Lint, Test, Coverage, Security
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Black
        run: black --check .

      - name: Run tests with coverage
        run: |
          pytest --cov=app \
                 --cov-report=term-missing \
                 --cov-report=xml:.coverage-reports/backend/coverage.xml \
                 --cov-report=html:.coverage-reports/backend/html \
                 --cov-fail-under=70

      - name: Security audit with pip-audit
        run: |
          pip install pip-audit
          pip-audit --disable-pip
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: .coverage-reports/
          retention-days: 30

  # Frontend: Lint, Test, Coverage, Security
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run coverage

      - name: Security audit with npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  docker-build:
    name: Docker Compose Build Test (PR to main)
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images via Compose
        run: docker compose build backend frontend

  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker-build
    if: >
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        github.base_ref != 'main' ||
        needs.docker-build.result == 'success'
      )

    steps:
      - name: All checks passed
        run: |
          echo "✅ CI passed"
          echo "Event: ${{ github.event_name }}"
          echo "Ref:   ${{ github.ref }}"
          echo "Backend:   ${{ needs.backend.result }}"
          echo "Frontend:  ${{ needs.frontend.result }}"
          echo "Docker:    ${{ needs.docker-build.result }}"
