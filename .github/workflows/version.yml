name: Versioning

on:
  push:
    branches:
      - main
      - develop
      - 'refactor/*'
      - 'feature/*'

permissions:
  contents: write

jobs:
  version:
    name: Auto Version Tagging
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Determine version bump type
        id: bump_type
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "prefix=" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "prefix=" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == refactor/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "prefix=" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: $BRANCH_NAME"
            exit 1
          fi

      - name: Get latest tag
        id: get_tag
        run: |
          # Get the latest tag, default to 0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # Remove 'v' prefix and parse version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "major=${MAJOR:-0}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR:-0}" >> $GITHUB_OUTPUT
          echo "patch=${PATCH:-0}" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          BUMP_TYPE="${{ steps.bump_type.outputs.bump }}"
          MAJOR=${{ steps.get_tag.outputs.major }}
          MINOR=${{ steps.get_tag.outputs.minor }}
          PATCH=${{ steps.get_tag.outputs.patch }}

          if [ "$BUMP_TYPE" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP_TYPE" == "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 New version: $NEW_VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $NEW_VERSION already exists, skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $NEW_VERSION does not exist, creating..."
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          BRANCH_NAME="${{ github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION from $BRANCH_NAME"
          git push origin "$NEW_VERSION"

          echo "🎉 Successfully created and pushed tag: $NEW_VERSION"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.new_version.outputs.version }}
          release_name: Release ${{ steps.new_version.outputs.version }}
          body: |
            ## Release ${{ steps.new_version.outputs.version }}

            Automated release from `${{ github.ref_name }}` branch.

            ### Changes
            - See commit history for details

            ### Artifacts
            - Docker image: `chatbot:latest`
          draft: false
          prerelease: false
